```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Lost & Found System</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                🔎 Lost<span>&</span>Found
            </div>

            <!-- Heading -->
            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Register to use the Lost & Found System
            </p>


            <!-- Register Form -->
            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Student ID -->
                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-btn">

                    Create Account

                </button>

            </form>


            <!-- Login Link -->
            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- Home Link -->
            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>

</html>
```
