```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Lost & Found System</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                🔎 Lost<span>&</span>Found
            </div>

            <!-- Heading -->
            <h1>Welcome Back 👋</h1>

            <p class="auth-subtitle">
                Login to your Lost & Found account
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Remember + Forgot -->
                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>

            </form>


            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>


            <!-- Signup -->
            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


            <!-- Back Home -->
            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>

</html>
```
